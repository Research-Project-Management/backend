name: Deploy Backend CI/CD to VPS

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: research-project-management/backend

jobs:
  test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Validate Prisma Schema
        run: pnpm exec prisma validate

      - name: Run ESLint
        run: pnpm run lint || true

      - name: Run Unit Tests
        run: pnpm test -- --coverage=false || true

      - name: Test Build Compilation
        run: pnpm run build || true

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Deploy to VPS Server
    needs: [test, build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.test.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -e
            echo "Starting deployment on VPS..."
            cd /opt/flux/backend

            # Synchronize git repository on VPS
            git checkout .
            BRANCH=$(git rev-parse --abbrev-ref HEAD || echo "main")
            git pull origin "$BRANCH"

            # Login to GitHub Container Registry if PAT_TOKEN is available
            if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
              echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            fi

            # Pull latest image from GHCR (fallback to local compose build if pull fails)
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest || docker compose build be

            # Recreate backend container cleanly
            docker compose up -d be

            # Run Prisma migrations inside backend container
            docker compose exec -T be npx prisma db push --skip-generate || docker compose exec -T be npx prisma migrate deploy || true

            # Clean up dangling images to save VPS storage
            docker image prune -f

            # Health verification
            sleep 3
            curl -sf http://127.0.0.1:3000/health/liveness || exit 1
            echo "Deployment successfully verified!"
