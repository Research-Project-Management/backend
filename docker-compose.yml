version: "3.8"

services:
  # Node.js Backend Application
  app:
    image: ghcr.io/research-project-management/backend:latest
    container_name: flux-backend
    command: node index.js
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - rpm-network

  # Redis Cache / Message Broker
  redis:
    image: redis:alpine
    container_name: flux-redis
    restart: unless-stopped
    networks:
      - rpm-network

networks:
  rpm-network:
    driver: bridge
