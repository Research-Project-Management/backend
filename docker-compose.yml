# ==============================================================================
# Flux Backend - Production Docker Compose Orchestration
# Standards: Container Orchestration Skill, Resource Limits, Log Rotation, Non-Root
# Note: Frontend (Next.js) is deployed on Vercel and excluded from this stack.
# ==============================================================================

name: flux

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: flux_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-flux-db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_PORT:-24532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-flux-db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-384M}
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - db
          - postgres

  # ----------------------------------------------------------------------------
  # 2. Redis Service (Unified Port 31679: Cache + Realtime Pub/Sub + BullMQ Queue)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: flux_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAXMEMORY:-140mb} --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-31679}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-192M}
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - redis
          - flux_redis

  # ----------------------------------------------------------------------------
  # 3. NestJS Fastify Backend Application Service (Production Target: runner)
  # ----------------------------------------------------------------------------
  be:
    profiles:
      - prod
      - app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/research-project-management/backend:latest
    container_name: flux_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18300}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      DIRECT_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_CACHE_URL: "redis://redis:6379"
      REDIS_REALTIME_URL: "redis://redis:6379"
      REDIS_QUEUE_URL: "redis://redis:6379"
      CLSI_URL: http://flux_clsi:3013
      CLSI_SANDBOX_MODE: remote
      CLSI_SCRATCH_DIR: /tmp/clsi-scratch
      CLSI_SCRATCH_GC_INTERVAL_MS: "${BE_SCRATCH_GC_INTERVAL_MS:-0}"
      CLSI_COMPILE_TIMEOUT_MS: "${CLSI_COMPILE_TIMEOUT_MS:-90000}"
      CLSI_AUTO_COMPILE_TIMEOUT_MS: "${CLSI_AUTO_COMPILE_TIMEOUT_MS:-30000}"
      CLSI_DRAFT_COMPILE_TIMEOUT_MS: "${CLSI_DRAFT_COMPILE_TIMEOUT_MS:-45000}"
      CLSI_SYNTAX_COMPILE_TIMEOUT_MS: "${CLSI_SYNTAX_COMPILE_TIMEOUT_MS:-20000}"
      CLIENT_URL: ${CLIENT_URL}
      ORIGINS: ${ORIGINS}
      TRUSTED_EXTRACTION_ENABLED: "true"
      TRUSTED_EXTRACTION_SHADOW_MODE: "${TRUSTED_SHADOW_MODE:-false}"
      TRUSTED_EXTRACTION_CANARY_PERCENT: "100"
      FLUX_AI_ENABLED: "${FLUX_AI_ENABLED:-true}"
      FLUX_AI_URL: "${FLUX_AI_URL:-http://host.docker.internal:18420}"
      AI_INTERNAL_API_KEY: "${AI_INTERNAL_API_KEY:-}"
      REALTIME_SERVICE_URL: http://flux_realtime:3014
      REALTIME_INTERNAL_API_KEY: "${REALTIME_INTERNAL_API_KEY:-}"
    volumes:
      - flux_clsi_scratch:/tmp/clsi-scratch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${BE_MEM_LIMIT:-768M}
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - be
          - backend

  # ----------------------------------------------------------------------------
  # 4. Dedicated BullMQ Background Worker Service
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/research-project-management/backend:latest
    container_name: flux_backend_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      DIRECT_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_CACHE_URL: "redis://redis:6379"
      REDIS_REALTIME_URL: "redis://redis:6379"
      REDIS_QUEUE_URL: "redis://redis:6379"
      SKIP_MIGRATIONS: "true"
      REALTIME_SERVICE_URL: http://flux_realtime:3014
      REALTIME_INTERNAL_API_KEY: "${REALTIME_INTERNAL_API_KEY:-}"
      TRUSTED_EXTRACTION_ENABLED: "true"
      TRUSTED_EXTRACTION_SHADOW_MODE: "${TRUSTED_SHADOW_MODE:-false}"
      TRUSTED_EXTRACTION_CANARY_PERCENT: "100"
      FLUX_AI_ENABLED: "${FLUX_AI_ENABLED:-true}"
      FLUX_AI_URL: "${FLUX_AI_URL:-http://host.docker.internal:18420}"
      AI_INTERNAL_API_KEY: "${AI_INTERNAL_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'dist/worker.js' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-0.75}"
          memory: ${WORKER_MEM_LIMIT:-768M}
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - worker
          - flux_worker

  # ----------------------------------------------------------------------------
  # 5. Common LaTeX Service Interface (CLSI) Microservice
  # ----------------------------------------------------------------------------
  clsi:
    build:
      context: .
      dockerfile: Dockerfile.clsi
      target: runner
      args:
        TEXLIVE_BASE: ${CLSI_TEXLIVE_BASE:-texlive-full-base}
    image: ghcr.io/research-project-management/clsi:latest
    container_name: flux_clsi
    restart: unless-stopped
    command: ["node", "dist/clsi.js"]
    ports:
      - "127.0.0.1:${CLSI_HOST_PORT:-18313}:3013"
    environment:
      PORT: 3013
      CLSI_PORT: 3013
      CLSI_SCRATCH_DIR: /tmp/clsi-scratch
      CLSI_MAX_CONCURRENT_COMPILES: "${CLSI_MAX_CONCURRENT_COMPILES:-2}"
      CLSI_SCRATCH_GC_INTERVAL_MS: "${CLSI_SCRATCH_GC_INTERVAL_MS:-3600000}"
      CLSI_COMPILE_TIMEOUT_MS: "${CLSI_COMPILE_TIMEOUT_MS:-90000}"
      CLSI_AUTO_COMPILE_TIMEOUT_MS: "${CLSI_AUTO_COMPILE_TIMEOUT_MS:-30000}"
      CLSI_DRAFT_COMPILE_TIMEOUT_MS: "${CLSI_DRAFT_COMPILE_TIMEOUT_MS:-45000}"
      CLSI_SYNTAX_COMPILE_TIMEOUT_MS: "${CLSI_SYNTAX_COMPILE_TIMEOUT_MS:-20000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3013/status || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${CLSI_CPU_LIMIT:-1.0}"
          memory: ${CLSI_MEM_LIMIT:-1024M}
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - flux_clsi_scratch:/tmp/clsi-scratch
    networks:
      flux_network:
        aliases:
          - clsi
          - flux_clsi

  # ----------------------------------------------------------------------------
  # 6. Dedicated Realtime Collaboration & Messaging Service (Socket.IO + Yjs)
  # ----------------------------------------------------------------------------
  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/research-project-management/backend:latest
    container_name: flux_realtime
    restart: unless-stopped
    command: ["node", "dist/realtime.js"]
    ports:
      - "127.0.0.1:${REALTIME_HOST_PORT:-18314}:3014"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3014
      REALTIME_PORT: 3014
      REALTIME_MODE: "true"
      SKIP_MIGRATIONS: "true"
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      DIRECT_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_CACHE_URL: "redis://redis:6379"
      REDIS_REALTIME_URL: "redis://redis:6379"
      REDIS_QUEUE_URL: "redis://redis:6379"
      CLIENT_URL: ${CLIENT_URL}
      ORIGINS: ${ORIGINS}
      REALTIME_INTERNAL_API_KEY: "${REALTIME_INTERNAL_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3014/health/liveness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${REALTIME_MEM_LIMIT:-512M}
        reservations:
          memory: 192M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - realtime
          - flux_realtime

volumes:
  postgres_data:
    name: flux_postgres_data
    driver: local
  redis_data:
    name: flux_redis_data
    driver: local
  flux_clsi_scratch:
    name: flux_clsi_scratch
    driver: local

networks:
  flux_network:
    name: flux_network
    driver: bridge

