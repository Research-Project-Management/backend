# ==============================================================================
# Flux Backend - Production Docker Compose Orchestration
# Standards: Container Orchestration Skill, Resource Limits, Log Rotation, Non-Root
# Note: Frontend (Next.js) is deployed on Vercel and excluded from this stack.
# ==============================================================================

name: flux

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: flux_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-flux-db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-flux-db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - db
          - postgres

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Queue Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: flux_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - redis
          - flux_redis

  # ----------------------------------------------------------------------------
  # 5. NestJS Fastify Backend Application Service (Production Target: runner)
  # ----------------------------------------------------------------------------
  be:
    profiles:
      - prod
      - app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/research-project-management/backend:latest
    container_name: flux_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      DIRECT_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_CACHE_URL: "redis://redis:6379"
      REDIS_QUEUE_URL: "redis://redis:6379"
      CLSI_URL: http://flux_clsi:3013
      CLIENT_URL: ${CLIENT_URL}
      ORIGINS: ${ORIGINS}
      TRUSTED_EXTRACTION_ENABLED: "true"
      TRUSTED_EXTRACTION_SHADOW_MODE: "${TRUSTED_SHADOW_MODE:-false}"
      TRUSTED_EXTRACTION_CANARY_PERCENT: "100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - be
          - backend

  # ----------------------------------------------------------------------------
  # 6. Dedicated BullMQ Background Worker Service
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/research-project-management/backend:latest
    container_name: flux_backend_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    volumes:
      - ./dist:/app/dist
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      DIRECT_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-flux-db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      REDIS_CACHE_URL: "redis://redis:6379"
      REDIS_QUEUE_URL: "redis://redis:6379"
      CLSI_URL: http://flux_clsi:3013
      SKIP_MIGRATIONS: "true"
      TRUSTED_EXTRACTION_ENABLED: "true"
      TRUSTED_EXTRACTION_SHADOW_MODE: "${TRUSTED_SHADOW_MODE:-false}"
      TRUSTED_EXTRACTION_CANARY_PERCENT: "100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'dist/worker.js' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      flux_network:
        aliases:
          - worker
          - flux_worker

  # ----------------------------------------------------------------------------
  # 7. Common LaTeX Service Interface (CLSI) Microservice
  # ----------------------------------------------------------------------------
  clsi:
    image: ghcr.io/research-project-management/clsi:latest
    container_name: flux_clsi
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLSI_PORT:-3013}:3013"
    environment:
      PORT: 3013
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - flux_latex_tectonic_cache:/root/.cache/Tectonic
    networks:
      flux_network:
        aliases:
          - clsi
          - flux_clsi

volumes:
  postgres_data:
    name: flux_postgres_data
    driver: local
  redis_data:
    name: flux_redis_data
    driver: local
  flux_latex_tectonic_cache:
    external: true

networks:
  flux_network:
    name: flux_network
    driver: bridge

